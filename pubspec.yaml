name: expensy
description: A privacy-first expense manager with no internet permission.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  path_provider: ^2.6.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_ml_kit: ^0.21.0
  image_picker: ^1.2.0
  receipt_recognition: ^0.2.8
  shared_preferences: ^2.5.3
  provider: ^6.1.4
  uuid: ^4.5.1
  path: ^1.9.1
  share_plus: ^9.0.0
  csv: ^6.0.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
